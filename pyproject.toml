[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webvulnscanner"
version = "2.3.0"
description = "Lightweight web vulnerability scanner for authorised security testing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "scanner", "pentesting", "web"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dom = ["playwright>=1.40"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8", "types-requests", "build"]

[project.scripts]
webvulnscanner = "scanner.cli:main"

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# default ruleset: pycodestyle errors (E4/E7/E9) + pyflakes (F)
select = ["E4", "E7", "E9", "F"]
exclude = ["docs", "reports"]

[tool.mypy]
packages = ["scanner"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# bs4 ships no inline types; playwright is an optional extra (domxss module)
# and is usually absent in lint environments
module = ["bs4.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that intentionally sleep for time-based injection checks",
]
