# Build sdist+wheel and publish to PyPI via Trusted Publishing.
#
# One-time setup on PyPI: create the "webvulnscanner" project and register
# this repository as a Trusted Publisher (Settings → Publishing → add
# GitHub repository "Chhhhhhhhhhhhhhh/WebVulnScanner", environment "pypi").

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
